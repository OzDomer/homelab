services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.11
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/data
    networks:
      - proxy
      - search
networks:
  proxy:
    external: true
  search:
    external: true
