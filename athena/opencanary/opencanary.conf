{
  "device.node_id": "athena-canary",
  "ip.ignorelist": [],
  "ftp.enabled": true,
  "ftp.port": 21,
  "ftp.banner": "FTP server ready",
  "telnet.enabled": true,
  "telnet.port": 23,
  "telnet.banner": "",
  "telnet.honeycreds": [],
  "mysql.enabled": true,
  "mysql.port": 3306,
  "mysql.banner": "5.5.43-0ubuntu0.14.04.1",
  "rdp.enabled": true,
  "rdp.port": 3389,
  "vnc.enabled": true,
  "vnc.port": 5900,
  "portscan.enabled": false,
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": { "format": "%(message)s" }
      },
      "handlers": {
        "console": {
          "class": "logging.StreamHandler",
          "stream": "ext://sys.stdout"
        },
        "ntfy": {
          "class": "opencanary.logger.WebhookHandler",
          "url": "http://ntfy/canary",
          "method": "POST",
          "data": { "message": "%(message)s" },
          "params": { "template": "canary" },
          "headers": {
            "Authorization": "$CANARY_NTFY_AUTH",
            "Content-Type": "application/json"
          },
          "status_code": 200,
          "ignore": ["\"logtype\": 1001"]
        }
      }
    }
  }
}
