services:
  adguard:
    image: adguard/adguardhome:v0.107.80
    container_name: adguard
    restart: unless-stopped
    ports:
      - "192.168.1.165:53:53/tcp"
      - "192.168.1.165:53:53/udp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    networks:
      - proxy

networks:
  proxy:
    external: true
