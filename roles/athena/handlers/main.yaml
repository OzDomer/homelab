- name: Apply nonlocal bind sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-nonlocal-bind.conf
  changed_when: true

- name: Reload udev rules
  ansible.builtin.shell: udevadm control --reload && udevadm trigger --subsystem-match=input --action=change && udevadm settle
  changed_when: true

- name: Restart kiosk
  ansible.builtin.systemd_service:
    name: kiosk.service
    state: restarted
    daemon_reload: true
