# Let services bind to 192.168.1.165 even while eth0 has no address.
# At boot, turning EEE off makes eth0 renegotiate its link, which drops the
# DHCP lease for a few seconds. Docker starting Caddy/AdGuard in that window
# used to leave them with no port mappings (fixable only by recreating).
net.ipv4.ip_nonlocal_bind = 1