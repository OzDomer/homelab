- name: Install sshd hardening
  ansible.builtin.copy:
    src: 00-hardening.conf
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: sshd -t -f %s
  notify: Reload ssh

- name: Install authorized SSH keys
  ansible.builtin.copy:
    src: authorized_keys
    dest: "/home/{{ ansible_user }}/.ssh/authorized_keys"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
    validate: ssh-keygen -l -f %s

- name: Install kitty's terminfo so full-screen tools work over SSH from kitty
  ansible.builtin.apt:
    name: kitty-terminfo
    state: present
    update_cache: true
    cache_valid_time: 86400

# --- packages
# state: present, never latest: installs what's missing, upgrades nothing.
- name: Install packages both hosts need
  ansible.builtin.apt:
    name: [git, ethtool, rsync, sqlite3]
    state: present
    update_cache: true
    cache_valid_time: 86400

# --- Docker (official apt repo)
# Same paths and deb822 format as the original manual install on both hosts,
# so this matches what's there and never adds a second Docker repo entry.
# docker.asc is Docker's public signing key (download.docker.com/linux/debian/gpg).
- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker's apt signing key
  ansible.builtin.copy:
    src: docker.asc
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Add Docker's apt repository
  ansible.builtin.copy:
    src: docker.sources
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  register: common_docker_repo

# state: present, never latest: a deploy must never upgrade Docker by surprise.
# A cache valid time of 0 forces a refresh right after the repo was added or
# changed; otherwise apt wouldn't know Docker's packages yet.
- name: Install Docker Engine with the Buildx and Compose plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if common_docker_repo is changed else 86400 }}"

- name: Add the admin user to the docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: [docker]
    append: true
