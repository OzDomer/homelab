services:
  postgres:
    image: postgres:18.6-alpine
    container_name: arena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bots_arena
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "arena", "-d", "bots_arena"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [db]
    mem_limit: 256m

  backend:
    image: ghcr.io/ozdomer/bot-arena-backend:main@sha256:3d6bacdaed182cbfaf461a7c8f23a4e190b043ae1988a3d979a4d00749413361
    container_name: arena-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://arena:${POSTGRES_PASSWORD}@postgres:5432/bots_arena
      CORS_ORIGIN: https://arena.example.com
      JWT_SECRET: ${JWT_SECRET}
      BETTING_WINDOW_MS: "60000"
      TRUST_PROXY_HOPS: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db, edge]
    mem_limit: 384m

  frontend:
    image: ghcr.io/ozdomer/bot-arena-frontend:main@sha256:c34af1793ea7faf8f3035c6b67230e6b11023ca1cfb81de591a5a21ddb586a4b
    container_name: arena-frontend
    restart: unless-stopped
    networks: [edge]
    mem_limit: 64m

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    container_name: arena-cloudflared
    restart: unless-stopped
    user: "1000:1000"
    command: tunnel --config /etc/cloudflared/config.yaml run
    volumes:
      - ./cloudflared.yaml:/etc/cloudflared/config.yaml:ro
      - ./credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on: [backend, frontend]
    networks: [edge]
    mem_limit: 128m

networks:
  db:
    internal: true
  edge:

volumes:
  pgdata:
